name: Windows build and download checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: download-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Known dependency vulnerabilities
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Check application's pinned dependencies and their dependencies
        shell: pwsh
        run: ./.github/scripts/audit-dependencies.ps1
      - name: Save dependency findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit
          path: artifacts/dependency-audit-*.txt
          if-no-files-found: warn
          retention-days: 14
  core:
    name: Download checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    env:
      QBDLX_REQUIRE_FLAC: '1'
      QBDLX_TEST_REPORT: artifacts/core-results.xml
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Get official FLAC 1.5.0 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: xiph/flac
          ref: 1507800de4b70e21be71f38caa0d9079d0bc6e45
          path: .ci-tools/flac-source
          persist-credentials: false
      - name: Build official FLAC decoder
        shell: pwsh
        run: ./.github/scripts/build-flac.ps1
      - name: Run download checks and 200-song simulated batch
        shell: pwsh
        run: |
          New-Item artifacts -ItemType Directory -Force | Out-Null
          dotnet run --project tests/CoreChecks/CoreChecks.csproj --configuration Release 2>&1 | Tee-Object artifacts/core-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: download-checks-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows ${{ matrix.configuration }} build and integration
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      QBDLX_TEST_REPORT: artifacts/windows-results.xml
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2
        with:
          nuget-version: 6.x
      - name: Restore exact application dependencies
        run: |
          nuget restore QobuzDownloaderX.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile Windows application
        run: |
          New-Item artifacts -ItemType Directory -Force | Out-Null
          msbuild QobuzDownloaderX.sln /t:Rebuild /p:Configuration=${{ matrix.configuration }} /m:2 /v:minimal /bl:artifacts/windows-build.binlog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Get official FLAC 1.5.0 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: xiph/flac
          ref: 1507800de4b70e21be71f38caa0d9079d0bc6e45
          path: .ci-tools/flac-source
          persist-credentials: false
      - name: Build official FLAC decoder
        shell: pwsh
        run: ./.github/scripts/build-flac.ps1
      - name: Run Windows integration and 100-song tagging checks
        shell: pwsh
        run: ./.github/scripts/windows-checks.ps1 -Configuration ${{ matrix.configuration }}
      - name: Package tested Windows program
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./.github/scripts/package-windows.ps1
      - name: Save compilation and check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.configuration }}-results
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
  publish:
    name: Make download available after every check passes
    needs: [dependencies, core, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-Release-results
          path: artifacts/
      - name: Save tested Windows download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QobuzDownloaderX-Windows-tested
          path: artifacts/QobuzDownloaderX-Windows.zip
          if-no-files-found: error
          retention-days: 14
